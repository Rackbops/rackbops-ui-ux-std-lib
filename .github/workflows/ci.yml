name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # Theme contract + release-bump tests (node:test, no runtime deps).
      - run: pnpm --filter @rackbops/styles test
      # Typecheck/build the React package (tsc, strict).
      - run: pnpm --filter @rackbops/ui-react build
      # React component render tests (node:test + tsx + react-dom/server).
      - run: pnpm --filter @rackbops/ui-react test
      # Local dev server containment/.git-exclusion regression tests (node:test).
      - run: node --test site/serve.test.mjs
      # SKILL.md's generated component table stays in sync with styles/contract.json (node:test).
      - run: node --test scripts/generate-skill-table.test.mjs
      # LICENSE/NOTICE packaging (copy-license.mjs) stays wired into both packages (node:test).
      - run: node --test scripts/copy-license.test.mjs

  # Visual regression -- a SEPARATE job (browser dependency) so the text suites
  # above stay fast and dependency-free. Screenshots every showcase section per
  # theme and compares to the committed baselines under site/__screenshots__.
  # Runs in the same Playwright container the baselines were generated in
  # (update-visual-baselines.yml) so rendering matches. Never regenerates here.
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm visual
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: |
            site/__screenshots__/**/*.diff.png
            site/__screenshots__/**/*.actual.png
          if-no-files-found: ignore
