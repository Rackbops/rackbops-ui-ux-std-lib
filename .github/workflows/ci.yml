name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # Theme contract + release-bump tests (node:test, no runtime deps).
      - run: pnpm --filter @rackbops/styles test
      # Typecheck/build the React package (tsc, strict).
      - run: pnpm --filter @rackbops/ui-react build
      # React component render tests (node:test + tsx + react-dom/server).
      - run: pnpm --filter @rackbops/ui-react test
      # Local dev server containment/.git-exclusion regression tests (node:test).
      - run: node --test site/serve.test.mjs
      # SKILL.md's generated component table stays in sync with styles/contract.json (node:test).
      - run: node --test scripts/generate-skill-table.test.mjs
