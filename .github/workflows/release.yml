name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed to create the tag and push the version-bump commit. The GitHub
# release itself is created by publish.yml (issue #88), triggered by the tag
# push this job makes.
permissions:
  contents: write

# Only one release run at a time. If a second push lands while a release is in
# progress, queue it — don't cancel. The queued run finds no unreleased commits
# (the tag was already created) and exits early.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Skip the bump commit re-releasing itself, and refuse a workflow_dispatch
    # from any branch but main (issue #33) — a manual dispatch supplies no
    # branch filter of its own the way `on.push.branches` does, so without
    # this the job would check out, bump, tag, and publish whatever branch
    # was dispatched. `github.ref` is the dispatched ref for workflow_dispatch
    # and is already guaranteed to be main for push (the `on.push.branches`
    # filter above), so this one check covers both trigger types. (The
    # `secrets` context is NOT available in a job-level `if` — only
    # github/needs/vars/inputs — so the "inert until RELEASE_TOKEN exists"
    # gate lives in the release step below, which reads the token from
    # step-level env where secrets ARE available.)
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore(release): v')) }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history is required to find the previous release tag.
          fetch-depth: 0
          # RELEASE_TOKEN so the bump commit bypasses branch protection and the
          # tag push triggers publish.yml (a GITHUB_TOKEN push would not).
          # Falls back to the default GITHUB_TOKEN for the checkout when the
          # secret is unset — the release step then no-ops, so that token's
          # write scope is never exercised.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release if there are unreleased changes
        env:
          # release.sh itself never calls `gh` (issue #88) -- this only gates
          # whether the token controlling the checkout's push rights
          # (RELEASE_TOKEN, above) actually exists, so a fork or a repo
          # without the secret configured no-ops here instead of attempting
          # a push doomed to fail against branch protection.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "RELEASE_TOKEN not set -- release/publish is inert. Skipping."
            exit 0
          fi
          chmod +x .github/scripts/release.sh .github/scripts/release-lib.sh .github/scripts/next-version.sh
          .github/scripts/release.sh
