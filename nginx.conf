# rackbops-ui-ux-std-lib -- served by nginx:alpine. Plain static HTML (site/index.html is
# hand-authored, no client-side router), so unknown paths 404 honestly rather than falling back
# to an SPA shell.
#
# Mounted at /etc/nginx/conf.d/default.conf -- a `server {}` FRAGMENT, not a full nginx.conf; the
# base image's own nginx.conf already supplies http{}/events{} and includes conf.d/*.conf.
#
# A change to THIS file needs `docker compose restart rackbops-ui-ux-std-lib-web` on the box --
# `nginx -s reload` after a git pull keeps serving the stale config, because the pull's checkout
# replaces the file via a new inode while Docker's single-file bind mount keeps watching the old
# one. See deploy/deploy-pull.sh, which flags this in its log when it detects the change.
server {
    listen 80;

    root  /usr/share/nginx/html;
    index index.html;

    # Liveness probe -- exact match, so it never falls through to `location /` below.
    location = /healthz {
        return 200;
    }

    # Deny dotfiles/dirs (.git, .env, ...) except /.well-known/. Matters because the repo-root
    # mount above would otherwise serve .git/ directly. `return 404` (not `deny all`) fires in
    # nginx's rewrite phase, before an access-phase `deny` would even run.
    location ~ /\.(?!well-known/) {
        return 404;
    }
    # Same reasoning, for the repo-root-level stack files the repo-root mount also exposes.
    location = /compose.yaml { return 404; }
    location = /nginx.conf   { return 404; }
    location ^~ /deploy/     { return 404; }

    # There is no root index.html -- the real page is /site/index.html -- so a bare `/` would
    # otherwise hit nginx's bare 403 with no indication where the showcase actually lives.
    location = / {
        return 302 /site/;
    }

    # An unknown path gets a real 404 rather than an SPA fallback, so link checkers and uptime
    # monitors see the truth.
    location / {
        try_files $uri $uri/ =404;
    }
}
