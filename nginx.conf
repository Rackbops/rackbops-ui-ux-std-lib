# rackbops-ui-ux-std-lib -- served by nginx:alpine. Plain static HTML (site/index.html is
# hand-authored, no client-side router), so unknown paths 404 honestly rather than falling back
# to an SPA shell or nginx's bare 403 on an index-less directory.
#
# Mounted at /etc/nginx/conf.d/default.conf -- a `server {}` FRAGMENT, not a full nginx.conf; the
# base image's own nginx.conf already supplies http{}/events{} and includes conf.d/*.conf.
#
# A change to THIS file needs `docker compose restart web` on the box -- `nginx -s reload` after a
# git pull keeps serving the stale config, because the pull's checkout replaces the file via a new
# inode while Docker's single-file bind mount keeps watching the old one. See
# deploy/deploy-pull.sh, which flags this in its log when it detects the change.
server {
    listen 80;

    # Behind the cloudflared tunnel, nginx only ever sees plain HTTP on :80 -- absolute_redirect's
    # default `on` would otherwise rewrite the relative `/site/` Location below into a scheme+host
    # URL built from nginx's own view of the request, which the tunnel doesn't need and shouldn't
    # be allowed to dictate.
    absolute_redirect off;

    root  /usr/share/nginx/html;
    # No `index` directive: the try_files rules below never let a directory reach the index
    # module (a bare `$uri` matches files only -- directories need the `$uri/` form), so the one
    # directory that must serve a page, /site/, is mapped to its file explicitly instead.

    # ALLOWLIST: only the locations below are served. Everything else -- .git/, compose.yaml,
    # nginx.conf, deploy/, or any other repo-root file the mount exposes -- falls through to the
    # catch-all `location /` at the bottom and gets a real 404. No per-file deny list to keep in
    # sync with the repo as it grows.

    # Liveness probe -- exact match, so it never falls through to `location /` below.
    location = /healthz {
        return 200;
    }

    # There is no root index.html -- the real page is /site/index.html -- so a bare `/` would
    # otherwise hit nginx's bare 403 with no indication where the showcase actually lives.
    location = / {
        return 302 /site/;
    }

    # The showcase entry point. Without this exact match, /site/ falls to the prefix location
    # below, where `try_files $uri` rejects the directory and answers 404 before any index lookup
    # (verified against nginx:alpine).
    location = /site/ {
        try_files /site/index.html =404;
    }

    # The rest of the showcase tree. `try_files $uri =404;` -- no `$uri/` -- never matches a
    # directory, so a sub-path with no backing file, or an index-less directory such as
    # /site/__screenshots__/, falls straight to `=404` instead of nginx's bare 403.
    location ^~ /site/ {
        try_files $uri =404;
    }

    # site/index.html does `import "../styles/all.css"`, a sibling of site/, and fetches
    # ../styles/manifest.json -- nginx must serve this directory too for those to resolve. Same
    # try_files reasoning; there's no styles/index.html, so a bare /styles/ 404s instead of
    # listing or 403ing.
    location ^~ /styles/ {
        try_files $uri =404;
    }

    # Everything not matched above -- an unknown path, or a repo-root file the mount exposes --
    # gets a real 404 rather than an SPA fallback or nginx's bare 403, so link checkers and uptime
    # monitors see the truth.
    location / {
        return 404;
    }
}
